# Runs GitHub's CodeQL static analysis over the Go code.
#
# Go is a compiled CodeQL language, so the database is built from a real compilation rather than from
# the source text. `build-mode: autobuild` lets the CodeQL action drive that build, which for this
# module is a plain `go build` over every package. Go is set up first so the database is built with the
# toolchain named in go.mod rather than whatever the runner happens to ship.
#
# Findings are reported under Security, Code scanning. This needs GitHub code scanning to be available
# for the repository, which is the case for a public repository. The job skips without starting a
# runner while the repository is private, then begins running automatically after it becomes public.
name: CodeQL

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    # A weekly run picks up new queries shipped after a change merged.
    - cron: "41 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.repository.private == false
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploading the results to the code scanning dashboard.
      security-events: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:go"
