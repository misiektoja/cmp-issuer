# Runs the Kind e2e suite across the supported Kubernetes and cert-manager versions.
#
# The node images are the ones published for the Kind release pinned as KIND_VERSION in the Makefile, so
# they have to be updated together with it. The newest row pins no image and follows the default that
# Kind itself ships with, so a Kind bump moves it automatically.
name: E2E Tests

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Kubernetes ${{ matrix.kubernetes }}, cert-manager ${{ matrix.certManager }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failing combination must not hide the result of the others.
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.37"
            nodeImage: ""
            certManager: v1.21.3
          - kubernetes: "1.36"
            nodeImage: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
            certManager: v1.21.3
          - kubernetes: "1.35"
            nodeImage: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
            certManager: v1.20.5
          - kubernetes: "1.34"
            nodeImage: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
            certManager: v1.19.6
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Running Test e2e
        env:
          KIND_NODE_IMAGE: ${{ matrix.nodeImage }}
          CERT_MANAGER_VERSION: ${{ matrix.certManager }}
        run: |
          go mod tidy
          make test-e2e

  # Enrollment against a real CMP server, which the specs above deliberately leave out so that a
  # controller regression is reported without waiting for a certification authority to start.
  test-e2e-ejbca:
    permissions:
      contents: read
      # Pulling the preconfigured CMP server image published by the CMP server test image workflow.
      packages: read
    name: Enrollment against EJBCA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      # The CMP server image is pulled when it has been published and built on the spot otherwise, so
      # this job passes on a repository whose test image workflow has not run yet.
      - name: Running enrollment test e2e
        run: make test-e2e-ejbca
