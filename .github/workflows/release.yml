# Publishes the manager image and the release artifacts.
# The workflow is inert until a version tag is pushed or it is dispatched by hand for an existing tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish image and artifacts
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Pushing the manager image to the registry.
      packages: write
      # Signing the build provenance attestation with a short lived identity.
      id-token: write
      attestations: write
    steps:
      - name: Resolve the release version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${DISPATCH_VERSION:-$REF_NAME}"
          if ! printf '%s\n' "$version" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release version must be a stable SemVer tag such as v0.1.0, got ${version}" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "chart_version=${version#v}"
            echo "image=${REGISTRY}/${GITHUB_REPOSITORY}:${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to rebuild a release that is already published
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This step runs before checkout, so there is no git remote for gh to infer the repository
          # from and it would fail with "failed to run git" on every run. Naming the repository keeps
          # that failure from being read as an absent release, which would disable the check below.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        # This runs before checkout, before the registry login and before anything is pushed, because a
        # release published by hand from the GitHub UI creates the tag and so starts this workflow. The
        # publication step at the end reaches the same verdict, but only after the image and its
        # provenance attestation are already live in the registry and cannot be withdrawn, which leaves
        # a published release carrying no assets next to an image that is real. Failing here costs the
        # ten seconds spent resolving the version.
        run: |
          # Only a release that is genuinely absent may be treated as absent. Any other gh failure,
          # such as an authentication or an API error, stops the run rather than being taken for one.
          if lookup="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>&1)"; then
            case "$lookup" in
              true) state=draft ;;
              false) state=published ;;
              *) echo "Unexpected release state for ${VERSION}: ${lookup}" >&2; exit 1 ;;
            esac
          elif printf '%s\n' "$lookup" | grep -q 'release not found'; then
            state=missing
          else
            echo "Could not determine whether ${VERSION} is already released: ${lookup}" >&2
            exit 1
          fi
          if [ "$state" = published ]; then
            echo "Release ${VERSION} is already published and cannot be rebuilt." >&2
            echo "Releases are built by pushing the tag, not by creating the release in the GitHub UI." >&2
            echo "This workflow creates the release as a draft for you to review and publish." >&2
            echo "To recover, delete the release and its tag, then push the tag again:" >&2
            echo "  gh release delete ${VERSION} --cleanup-tag --yes" >&2
            echo "  git push origin ${VERSION}" >&2
            exit 1
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.version }}

      - name: Verify the release tag belongs to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag_commit="$(git rev-list -n 1 "$VERSION")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/${DEFAULT_BRANCH}"; then
            echo "Release tag ${VERSION} is not reachable from ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the release description from the release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        # The GitHub release body is the section RELEASE_NOTES.md already carries for this version,
        # rather than the pull request list --generate-notes assembles. This runs before the image is
        # published so a missing or renamed section fails the release while retagging is still cheap.
        run: |
          mkdir -p dist
          awk -v want="## [${VERSION#v}]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' RELEASE_NOTES.md | sed '/./,$!d' > dist/release-body.md
          if ! grep -q '[^[:space:]]' dist/release-body.md; then
            echo "RELEASE_NOTES.md carries no ## [${VERSION#v}] section to publish as the release description" >&2
            exit 1
          fi

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push the multi architecture image
        env:
          IMG: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        # One build with two exporters, so the archive that ships in the air-gapped bundle is the
        # published image rather than a rebuild of the same source. VERSION names the exported
        # archive, so the bundle step later finds the archive this build wrote.
        run: make docker-release IMG="$IMG" VERSION="$VERSION" PLATFORMS=linux/amd64,linux/arm64

      - name: Resolve the published image digest
        id: digest
        env:
          IMG: ${{ steps.release.outputs.image }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance of the image
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Stage the signed provenance for the release
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.release.outputs.version }}
        run: cp "$PROVENANCE_BUNDLE" "dist/cmp-issuer-${VERSION}-provenance.sigstore.json"

      - name: Build the installer manifest
        env:
          IMG: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: make build-installer IMG="$IMG" VERSION="$VERSION"

      - name: Generate the software bill of materials
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make sbom VERSION="$VERSION"

      - name: Package the Helm chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          make helm
          ./bin/helm package charts/cmp-issuer --destination dist --version "${VERSION#v}" --app-version "${VERSION}"

      - name: Assemble the air-gapped install bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make release-bundle VERSION="$VERSION"

      - name: Build complete source archives and release checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make release-checksums VERSION="$VERSION"

      # Lets consumers verify that every installable artifact and source archive came from this run.
      - name: Attest the release artifacts' build provenance
        id: artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cmp-issuer-${{ steps.release.outputs.version }}-install.yaml
            dist/cmp-issuer-${{ steps.release.outputs.version }}-sbom.cdx.json
            dist/cmp-issuer-${{ steps.release.outputs.chart_version }}.tgz
            dist/cmp-issuer-${{ steps.release.outputs.version }}-airgap.tar.gz
            dist/cmp-issuer-${{ steps.release.outputs.version }}-source.zip
            dist/cmp-issuer-${{ steps.release.outputs.version }}-source.tar.gz
            dist/cmp-issuer-${{ steps.release.outputs.version }}_SHA256SUMS.txt

      # Publishing the bundle next to the artifacts lets an offline verifier check their provenance
      # without calling the attestations API. The .intoto.jsonl name is also the one supply chain
      # scanners look for when deciding whether a release carries provenance at all, so the image
      # bundle staged above as a .sigstore.json file does not stand in for it.
      - name: Stage the signed artifact provenance for the release
        env:
          ARTIFACT_BUNDLE: ${{ steps.artifacts.outputs.bundle-path }}
          VERSION: ${{ steps.release.outputs.version }}
        run: cp "$ARTIFACT_BUNDLE" "dist/cmp-issuer-${VERSION}.intoto.jsonl"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STATE: ${{ steps.existing.outputs.state }}
          VERSION: ${{ steps.release.outputs.version }}
        # The state was settled before the build started, so the published case is already gone by the
        # time this runs. Reusing that verdict rather than asking again keeps one definition of what a
        # rebuild is allowed to do, and a release that appeared while the build was running is caught
        # by --verify-tag and by the create call failing rather than being quietly overwritten.
        run: |
          case "$RELEASE_STATE" in
            draft)
              gh release edit "$VERSION" --draft --notes-file dist/release-body.md --title "$VERSION" --verify-tag
              ;;
            *)
              gh release create "$VERSION" --draft --notes-file dist/release-body.md --title "$VERSION" --verify-tag
              ;;
          esac
          # Every asset is named after the release rather than matched by a glob, so a stale file left
          # in dist by an earlier run of this workflow cannot be attached to this one. The chart is the
          # exception to the v prefix, because a Helm chart version has to be bare SemVer.
          gh release upload "$VERSION" "dist/cmp-issuer-${VERSION}-install.yaml" "dist/cmp-issuer-${VERSION}-sbom.cdx.json" "dist/cmp-issuer-${VERSION}-provenance.sigstore.json" "dist/cmp-issuer-${VERSION}.intoto.jsonl" "dist/cmp-issuer-${VERSION#v}.tgz" "dist/cmp-issuer-${VERSION}-airgap.tar.gz" "dist/cmp-issuer-${VERSION}-source.zip" "dist/cmp-issuer-${VERSION}-source.tar.gz" "dist/cmp-issuer-${VERSION}_SHA256SUMS.txt" --clobber
