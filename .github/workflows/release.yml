# Publishes the manager image and the release artifacts.
# The workflow is inert until a version tag is pushed or it is dispatched by hand for an existing tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish image and artifacts
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Pushing the manager image to the registry.
      packages: write
      # Signing the build provenance attestation with a short lived identity.
      id-token: write
      attestations: write
    steps:
      - name: Resolve the release version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${DISPATCH_VERSION:-$REF_NAME}"
          if ! printf '%s\n' "$version" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release version must be a stable SemVer tag such as v0.1.0, got ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY}:${version}" >> "$GITHUB_OUTPUT"

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.version }}

      - name: Verify the release tag belongs to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag_commit="$(git rev-list -n 1 "$VERSION")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/${DEFAULT_BRANCH}"; then
            echo "Release tag ${VERSION} is not reachable from ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the release description from the release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        # The GitHub release body is the section RELEASE_NOTES.md already carries for this version,
        # rather than the pull request list --generate-notes assembles. This runs before the image is
        # published so a missing or renamed section fails the release while retagging is still cheap.
        run: |
          mkdir -p dist
          awk -v want="## [${VERSION#v}]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' RELEASE_NOTES.md | sed '/./,$!d' > dist/release-body.md
          if ! grep -q '[^[:space:]]' dist/release-body.md; then
            echo "RELEASE_NOTES.md carries no ## [${VERSION#v}] section to publish as the release description" >&2
            exit 1
          fi

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push the multi architecture image
        env:
          IMG: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        # One build with two exporters, so the archive that ships in the air-gapped bundle is the
        # published image rather than a rebuild of the same source. VERSION names the exported
        # archive, so the bundle step later finds the archive this build wrote.
        run: make docker-release IMG="$IMG" VERSION="$VERSION" PLATFORMS=linux/amd64,linux/arm64

      - name: Resolve the published image digest
        id: digest
        env:
          IMG: ${{ steps.release.outputs.image }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance of the image
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Stage the signed provenance for the release
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.release.outputs.version }}
        run: cp "$PROVENANCE_BUNDLE" "dist/cmp-issuer-${VERSION}-provenance.sigstore.json"

      - name: Build the installer manifest
        env:
          IMG: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: make build-installer IMG="$IMG" VERSION="$VERSION"

      - name: Generate the software bill of materials
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make sbom VERSION="$VERSION"

      - name: Package the Helm chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          make helm
          ./bin/helm package charts/cmp-issuer --destination dist --version "${VERSION#v}" --app-version "${VERSION}"

      - name: Assemble the air-gapped install bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make release-bundle VERSION="$VERSION"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          release_state="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "$release_state" in
            true)
              gh release edit "$VERSION" --draft --notes-file dist/release-body.md --title "$VERSION" --verify-tag
              ;;
            false)
              echo "Release ${VERSION} is already published and cannot be rebuilt" >&2
              exit 1
              ;;
            *)
              gh release create "$VERSION" --draft --notes-file dist/release-body.md --title "$VERSION" --verify-tag
              ;;
          esac
          # Every asset is named after the release rather than matched by a glob, so a stale file left
          # in dist by an earlier run of this workflow cannot be attached to this one. The chart is the
          # exception to the v prefix, because a Helm chart version has to be bare SemVer.
          gh release upload "$VERSION" "dist/cmp-issuer-${VERSION}-install.yaml" "dist/cmp-issuer-${VERSION}-sbom.cdx.json" "dist/cmp-issuer-${VERSION}-provenance.sigstore.json" "dist/cmp-issuer-${VERSION#v}.tgz" "dist/cmp-issuer-${VERSION}-airgap.tar.gz" --clobber
