name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Verify CMP interoperability against the OpenSSL mock server
        run: |
          openssl version
          go test ./internal/protocol/ -run OpenSSL -v -count=1 > openssl-interop.log 2>&1 || { cat openssl-interop.log; exit 1; }
          cat openssl-interop.log
          if grep -q -- "--- SKIP" openssl-interop.log; then echo "The OpenSSL CMP mock server is unavailable on this runner, so the interoperability coverage silently disappeared"; exit 1; fi

      - name: Running Tests
        run: |
          go mod tidy
          make test
