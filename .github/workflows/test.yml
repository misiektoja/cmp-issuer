name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The runner image ships OpenSSL 3.0, whose CMP mock server cannot check the oldCertID a KUR
      # carries because it has no -ref_cert option. OpenSSL added that option in 3.2, so the KUR
      # interoperability coverage needs a newer build than the distribution package provides. The
      # Homebrew bottle is prebuilt, and OPENSSL_BIN points the test at it. The runner image installs
      # Homebrew without putting it on PATH, so the shell environment has to be loaded first.
      - name: Install a CMP-capable OpenSSL
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then echo "the runner image no longer ships Homebrew, so the OpenSSL install needs another source" >&2; exit 1; fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install openssl@3
          binary="$(brew --prefix openssl@3)/bin/openssl"
          if ! "$binary" cmp -help 2>&1 | grep -q -- "-ref_cert"; then echo "the installed OpenSSL has no -ref_cert option, so the KUR interoperability coverage would disappear" >&2; exit 1; fi
          echo "OPENSSL_BIN=$binary" >> "$GITHUB_ENV"

      # The log is written outside the working tree so that it cannot be mistaken for an uncommitted
      # file by the generated artifact check below.
      - name: Verify CMP interoperability against the OpenSSL mock server
        run: |
          "$OPENSSL_BIN" version
          log="$RUNNER_TEMP/openssl-interop.log"
          go test ./internal/protocol/ -run OpenSSL -v -count=1 > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          if grep -q -- "--- SKIP" "$log"; then echo "The OpenSSL CMP mock server is unavailable on this runner, so the interoperability coverage silently disappeared"; exit 1; fi

      # go mod tidy and the generation targets rewrite tracked files, so running them without this
      # check lets CI repair a stale go.mod, CRD, RBAC rule or deepcopy file and report success on a
      # tree that no longer matches the commit.
      - name: Verify the generated artifacts are committed
        run: |
          go mod tidy
          make manifests generate fmt
          if ! git diff --exit-code; then echo "go.mod, go.sum or a generated artifact is stale. Run 'go mod tidy' and 'make manifests generate fmt' locally and commit the result." >&2; exit 1; fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then echo "Generation produced files that are not committed:" >&2; echo "$untracked" >&2; exit 1; fi

      - name: Running Tests
        run: make test
