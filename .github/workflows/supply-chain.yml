name: Supply chain

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    # A weekly run catches vulnerabilities that are published after a change merged.
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    permissions:
      contents: read
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: make govulncheck

  gitleaks:
    permissions:
      contents: read
    name: Leaked credentials
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The history scan needs every commit, not just the checked out tip.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run gitleaks
        run: make gitleaks

  sbom:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Generate the SBOM
        run: make sbom

      # The routine run has no release version, so the file is named after the commit it describes and
      # is matched by pattern here rather than by a fixed path.
      - name: Publish the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmp-issuer-sbom
          path: dist/cmp-issuer-*-sbom.cdx.json
          if-no-files-found: error

  image-scan:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    name: Container image vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the manager image
        run: make docker-build IMG=cmp-issuer:scan

      - name: Scan the manager image
        run: make scan-image IMG=cmp-issuer:scan
