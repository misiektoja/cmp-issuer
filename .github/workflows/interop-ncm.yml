# Enrolls a real certificate from a hosted Nokia NCM instance and checks the result end to end.
#
# This workflow is the only one that talks to a PKI outside the repository, so it never runs on a push
# or a pull request. Start it by hand, or enable the schedule below once the endpoint is stable.
#
# It is inert until the repository carries the configuration. Every run begins with a preflight job
# that reports which protection mechanisms and which transports are configured and stops cleanly when
# either dimension is empty, so a fork or a repository without the endpoint gets a green skip rather
# than a failure.
#
# One job runs per protection mechanism and transport, so a complete configuration exercises four
# enrollments: PasswordBasedMac over HTTP, PasswordBasedMac over HTTPS, Signature over HTTP and
# Signature over HTTPS. Configure only the transports the server actually exposes.
#
# Repository configuration, all under Settings, Secrets and variables, Actions:
#
# | Secret | Required | Contents |
# | --- | --- | --- |
# | `NCM_CMP_HTTP_URL` | one URL at least | Plain HTTP CMP endpoint, for example `http://host.example:8080/pkix/` |
# | `NCM_CMP_HTTPS_URL` | one URL at least | HTTPS CMP endpoint, for example `https://host.example/pkix/` |
# | `NCM_CMP_RECIPIENT_DN` | yes | Distinguished name of the issuing CA, the CMP recipient |
# | `NCM_CMP_RESPONSE_TRUST` | yes | PEM anchor that signs the CMP responses and the issued chain |
# | `NCM_CMP_PBM_REFERENCE` | PasswordBasedMac | Reference number identifying the shared secret |
# | `NCM_CMP_PBM_SECRET` | PasswordBasedMac | Shared secret value |
# | `NCM_CMP_BOOTSTRAP_CERT` | Signature | PEM certificate that signs the CMP requests |
# | `NCM_CMP_BOOTSTRAP_KEY` | Signature | PEM private key for that certificate |
# | `NCM_CMP_BOOTSTRAP_CHAIN` | no | PEM issuers of that certificate, sent in `extraCerts` |
# | `NCM_CMP_HTTPS_TRUST` | no | PEM anchor for the HTTPS server certificate, when it is not publicly trusted |
#
# | Variable | Required | Contents |
# | --- | --- | --- |
# | `NCM_CMP_CERT_PROFILE` | no | Certificate profile name sent as `spec.protocol.certProfile` |
# | `NCM_CMP_COMMON_NAME` | no | Common name to enroll. Unset gives `cmp-issuer-test-<UTC YYMMDD-HHMMSS>`, unique per run |
# | `NCM_CMP_COUNTRY` | no | Country requested in the subject, for example `PL`. Omitted when unset |
# | `NCM_CMP_ORGANIZATION` | no | Organization requested in the subject, for example `cmp-issuer`. Omitted when unset |
#
# A CA that enforces its own subject answers `grantedWithMods`, which the issuer rejects under
# `policy.grantedModifications: Reject`. Clear the country and organization variables if that happens.
#
# The endpoint URLs and the recipient are held as secrets rather than variables so that a run against a
# private instance does not print them in the log.
name: NCM interoperability

on:
  workflow_dispatch:
    inputs:
      kubernetes:
        description: "Kind node image, empty for the default"
        required: false
        type: string
        default: ""
      certManager:
        description: "cert-manager version to install"
        required: false
        type: string
        default: v1.20.3
      renewal:
        description: "Re-enroll the certificate afterwards to exercise repeat P10CR"
        required: false
        type: boolean
        default: false
  # Enable once the endpoint is stable enough to gate a weekly run on.
  # schedule:
  #   - cron: "23 4 * * 2"

permissions: {}

env:
  KIND_CLUSTER: cmp-issuer-interop
  MANAGER_IMAGE: localhost/cmp-issuer:interop
  ISSUER_NAMESPACE: cmp-issuer-interop

jobs:
  preflight:
    name: Check the endpoint configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      passwordbasedmac: ${{ steps.check.outputs.passwordbasedmac }}
      signature: ${{ steps.check.outputs.signature }}
      http: ${{ steps.check.outputs.http }}
      https: ${{ steps.check.outputs.https }}
    steps:
      - name: Report which protection mechanisms and transports are configured
        id: check
        env:
          HTTP_URL: ${{ secrets.NCM_CMP_HTTP_URL }}
          HTTPS_URL: ${{ secrets.NCM_CMP_HTTPS_URL }}
          RECIPIENT_DN: ${{ secrets.NCM_CMP_RECIPIENT_DN }}
          RESPONSE_TRUST: ${{ secrets.NCM_CMP_RESPONSE_TRUST }}
          HTTPS_TRUST: ${{ secrets.NCM_CMP_HTTPS_TRUST }}
          PBM_REFERENCE: ${{ secrets.NCM_CMP_PBM_REFERENCE }}
          PBM_SECRET: ${{ secrets.NCM_CMP_PBM_SECRET }}
          BOOTSTRAP_CERT: ${{ secrets.NCM_CMP_BOOTSTRAP_CERT }}
          BOOTSTRAP_KEY: ${{ secrets.NCM_CMP_BOOTSTRAP_KEY }}
        run: |
          # Only whether each value is present is reported. No value is printed.
          endpoint=true
          for name in RECIPIENT_DN RESPONSE_TRUST; do
            if [ -z "${!name}" ]; then
              echo "missing NCM_CMP_${name}"
              endpoint=false
            fi
          done

          # A transport is exercised only when its own URL is configured, so a server that offers just
          # one of the two is not reported as a failure.
          http=false
          if [ "$endpoint" = true ] && [ -n "$HTTP_URL" ]; then
            http=true
          fi
          https=false
          if [ "$endpoint" = true ] && [ -n "$HTTPS_URL" ]; then
            https=true
          fi
          if [ "$endpoint" = true ] && [ -z "$HTTP_URL" ] && [ -z "$HTTPS_URL" ]; then
            echo "missing NCM_CMP_HTTP_URL and NCM_CMP_HTTPS_URL, at least one is needed"
          fi

          passwordbasedmac=false
          if [ -n "$PBM_REFERENCE" ] && [ -n "$PBM_SECRET" ]; then
            passwordbasedmac=true
          fi
          signature=false
          if [ -n "$BOOTSTRAP_CERT" ] && [ -n "$BOOTSTRAP_KEY" ]; then
            signature=true
          fi

          {
            echo "passwordbasedmac=${passwordbasedmac}"
            echo "signature=${signature}"
            echo "http=${http}"
            echo "https=${https}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "| Protection | Configured |"
            echo "| --- | --- |"
            echo "| PasswordBasedMac | ${passwordbasedmac} |"
            echo "| Signature | ${signature} |"
            echo ""
            echo "| Transport | Configured |"
            echo "| --- | --- |"
            echo "| HTTP | ${http} |"
            echo "| HTTPS | ${https} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$https" = true ] && [ -z "$HTTPS_TRUST" ]; then
            echo "NCM_CMP_HTTPS_TRUST is not set, so the HTTPS server certificate must chain to a publicly trusted root."
          fi
          if [ "$passwordbasedmac" = false ] && [ "$signature" = false ]; then
            echo "No CMP protection credentials are configured for this repository, so the enrollment jobs are skipped."
          fi
          if [ "$http" = false ] && [ "$https" = false ]; then
            echo "No NCM endpoint is configured for this repository, so the enrollment jobs are skipped."
          fi

  enroll:
    name: Enroll with ${{ matrix.protection }} over ${{ matrix.transport }}
    needs: preflight
    if: >-
      (needs.preflight.outputs.passwordbasedmac == 'true' || needs.preflight.outputs.signature == 'true')
      && (needs.preflight.outputs.http == 'true' || needs.preflight.outputs.https == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        protection: [PasswordBasedMac, Signature]
        transport: [HTTP, HTTPS]
    steps:
      - name: Decide whether this combination is configured
        id: configured
        env:
          PASSWORDBASEDMAC: ${{ needs.preflight.outputs.passwordbasedmac }}
          SIGNATURE: ${{ needs.preflight.outputs.signature }}
          HTTP: ${{ needs.preflight.outputs.http }}
          HTTPS: ${{ needs.preflight.outputs.https }}
          PROTECTION: ${{ matrix.protection }}
          TRANSPORT: ${{ matrix.transport }}
        run: |
          case "$PROTECTION" in
            PasswordBasedMac) protection="$PASSWORDBASEDMAC" ;;
            Signature) protection="$SIGNATURE" ;;
            *) protection=false ;;
          esac
          case "$TRANSPORT" in
            HTTP) transport="$HTTP" ;;
            HTTPS) transport="$HTTPS" ;;
            *) transport=false ;;
          esac

          run=false
          if [ "$protection" = true ] && [ "$transport" = true ]; then
            run=true
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then
            echo "${PROTECTION} over ${TRANSPORT} is not configured for this repository, skipping."
          fi

      - name: Clone the code
        if: steps.configured.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: steps.configured.outputs.run == 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Create the cluster
        if: steps.configured.outputs.run == 'true'
        env:
          KIND_NODE_IMAGE: ${{ inputs.kubernetes }}
        run: make setup-test-e2e

      - name: Install cert-manager
        if: steps.configured.outputs.run == 'true'
        env:
          CERT_MANAGER_VERSION: ${{ inputs.certManager }}
        run: |
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          kubectl wait deployment.apps/cert-manager-webhook --for condition=Available --namespace cert-manager --timeout 5m

      - name: Build and load the manager image
        if: steps.configured.outputs.run == 'true'
        run: |
          make docker-build IMG="$MANAGER_IMAGE"
          ./bin/kind load docker-image "$MANAGER_IMAGE" --name "$KIND_CLUSTER"

      - name: Install cmp-issuer
        if: steps.configured.outputs.run == 'true'
        run: |
          # The namespace has to exist first, because the chart creates the credential reader binding
          # in every namespace listed in credentialNamespaces.
          kubectl create namespace "$ISSUER_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          make helm-deploy IMG="$MANAGER_IMAGE" \
            HELM_EXTRA_ARGS="--set logging.level=debug --set credentialNamespaces={${ISSUER_NAMESPACE}}"
          kubectl get pods -n cmp-issuer-system

      - name: Store the endpoint credentials
        if: steps.configured.outputs.run == 'true'
        env:
          RESPONSE_TRUST: ${{ secrets.NCM_CMP_RESPONSE_TRUST }}
          HTTPS_TRUST: ${{ secrets.NCM_CMP_HTTPS_TRUST }}
          PBM_REFERENCE: ${{ secrets.NCM_CMP_PBM_REFERENCE }}
          PBM_SECRET: ${{ secrets.NCM_CMP_PBM_SECRET }}
          BOOTSTRAP_CERT: ${{ secrets.NCM_CMP_BOOTSTRAP_CERT }}
          BOOTSTRAP_KEY: ${{ secrets.NCM_CMP_BOOTSTRAP_KEY }}
          BOOTSTRAP_CHAIN: ${{ secrets.NCM_CMP_BOOTSTRAP_CHAIN }}
          PROTECTION: ${{ matrix.protection }}
          TRANSPORT: ${{ matrix.transport }}
        run: |
          # Values are written from the environment into files under the runner temporary directory and
          # read back with --from-file, so no credential ever appears in a command line.
          umask 077
          material="${RUNNER_TEMP}/cmp"
          mkdir -p "$material"

          printf '%s' "$RESPONSE_TRUST" > "${material}/ca.crt"
          kubectl create secret generic cmp-trust -n "$ISSUER_NAMESPACE" \
            --from-file=ca.crt="${material}/ca.crt" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Transport trust is separate from CMP trust and is only meaningful on HTTPS.
          if [ "$TRANSPORT" = HTTPS ] && [ -n "$HTTPS_TRUST" ]; then
            printf '%s' "$HTTPS_TRUST" > "${material}/https-ca.crt"
            kubectl create secret generic cmp-https-trust -n "$ISSUER_NAMESPACE" \
              --from-file=ca.crt="${material}/https-ca.crt" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          if [ "$PROTECTION" = PasswordBasedMac ]; then
            printf '%s' "$PBM_REFERENCE" > "${material}/reference"
            printf '%s' "$PBM_SECRET" > "${material}/secret"
            kubectl create secret generic cmp-credentials -n "$ISSUER_NAMESPACE" \
              --from-file=reference="${material}/reference" \
              --from-file=secret="${material}/secret" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            printf '%s' "$BOOTSTRAP_CERT" > "${material}/tls.crt"
            printf '%s' "$BOOTSTRAP_KEY" > "${material}/tls.key"
            create=(kubectl create secret generic cmp-credentials -n "$ISSUER_NAMESPACE"
              --from-file=tls.crt="${material}/tls.crt"
              --from-file=tls.key="${material}/tls.key")
            if [ -n "$BOOTSTRAP_CHAIN" ]; then
              # A separate file name so the chain cannot overwrite the CMP trust anchor.
              printf '%s' "$BOOTSTRAP_CHAIN" > "${material}/bootstrap-chain.crt"
              create+=(--from-file=ca.crt="${material}/bootstrap-chain.crt")
            fi
            "${create[@]}" --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Create the issuer
        if: steps.configured.outputs.run == 'true'
        env:
          HTTP_URL: ${{ secrets.NCM_CMP_HTTP_URL }}
          HTTPS_URL: ${{ secrets.NCM_CMP_HTTPS_URL }}
          RECIPIENT_DN: ${{ secrets.NCM_CMP_RECIPIENT_DN }}
          CERT_PROFILE: ${{ vars.NCM_CMP_CERT_PROFILE }}
          HTTPS_TRUST: ${{ secrets.NCM_CMP_HTTPS_TRUST }}
          BOOTSTRAP_CHAIN: ${{ secrets.NCM_CMP_BOOTSTRAP_CHAIN }}
          PROTECTION: ${{ matrix.protection }}
          TRANSPORT: ${{ matrix.transport }}
        run: |
          if [ "$TRANSPORT" = HTTPS ]; then
            URL="$HTTPS_URL"
          else
            URL="$HTTP_URL"
          fi

          # The manifest is fed through stdin so the endpoint and the recipient stay out of the log.
          {
            cat <<YAML
          apiVersion: certmanager.misiektoja.github.io/v1alpha1
          kind: CMPIssuer
          metadata:
            name: ncm
            namespace: ${ISSUER_NAMESPACE}
          spec:
            endpoint:
              url: ${URL}
              timeout: 30s
              maxResponseSize: 1048576
            protocol:
              version: 2
              initialEnrollment: P10CR
              recipient: "${RECIPIENT_DN}"
              confirmation: Explicit
          YAML
            if [ -n "$CERT_PROFILE" ]; then
              echo "    certProfile: \"${CERT_PROFILE}\""
            fi
            if [ "$PROTECTION" = PasswordBasedMac ]; then
              cat <<'YAML'
            protection:
              type: PasswordBasedMac
              passwordBasedMac:
                secretRef:
                  name: cmp-credentials
                referenceKey: reference
                secretKey: secret
                algorithm:
                  owf: SHA256
                  mac: HMACSHA256
                  iterationCount: 1024
          YAML
            else
              cat <<'YAML'
            protection:
              type: Signature
              signature:
                secretRef:
                  name: cmp-credentials
                certificateKey: tls.crt
                privateKeyKey: tls.key
          YAML
              # The chain is only sent when a key names it, so it is set with the secret that carries it.
              if [ -n "$BOOTSTRAP_CHAIN" ]; then
                echo "      chainKey: ca.crt"
              fi
            fi
            cat <<'YAML'
            cmpTrust:
              caSecretRef:
                name: cmp-trust
                key: ca.crt
            policy:
              grantedModifications: Reject
          YAML
            if [ "$TRANSPORT" = HTTPS ] && [ -n "$HTTPS_TRUST" ]; then
              cat <<'YAML'
            transport:
              tls:
                caSecretRef:
                  name: cmp-https-trust
                  key: ca.crt
          YAML
            fi
          } | kubectl apply -f -

          kubectl wait cmpissuer/ncm -n "$ISSUER_NAMESPACE" --for condition=Ready --timeout 2m

      - name: Confirm the endpoint scheme matches the transport under test
        if: steps.configured.outputs.run == 'true'
        env:
          TRANSPORT: ${{ matrix.transport }}
        run: |
          # A misconfigured secret would otherwise let the HTTPS row silently repeat the HTTP one.
          scheme="$(kubectl get cmpissuer/ncm -n "$ISSUER_NAMESPACE" -o jsonpath='{.spec.endpoint.url}' | cut -d: -f1)"
          case "$TRANSPORT" in
            HTTP) expected=http ;;
            HTTPS) expected=https ;;
          esac
          if [ "$scheme" != "$expected" ]; then
            echo "::error::the ${TRANSPORT} row is pointed at a ${scheme} endpoint, check NCM_CMP_${TRANSPORT}_URL"
            exit 1
          fi
          echo "enrolling over ${scheme}"

      - name: Enroll a certificate
        if: steps.configured.outputs.run == 'true'
        env:
          COMMON_NAME: ${{ vars.NCM_CMP_COMMON_NAME }}
          COUNTRY: ${{ vars.NCM_CMP_COUNTRY }}
          ORGANIZATION: ${{ vars.NCM_CMP_ORGANIZATION }}
        run: |
          # An unset common name gets a UTC timestamp, so each run enrolls a distinct identity. A
          # server profile that authorizes an identity to enroll only once would otherwise refuse
          # every run after the first.
          common_name="${COMMON_NAME:-cmp-issuer-test-$(date -u +%y%m%d-%H%M%S)}"
          echo "enrolling CN=${common_name}"

          {
            cat <<YAML
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: interop
            namespace: ${ISSUER_NAMESPACE}
          spec:
            secretName: interop-tls
            commonName: "${common_name}"
          YAML
            # Country and organization are only requested when set, because a CA that enforces its own
            # subject answers grantedWithMods, which policy.grantedModifications Reject turns into a
            # failed enrollment. Clear both variables to fall back to a bare common name.
            if [ -n "$COUNTRY" ] || [ -n "$ORGANIZATION" ]; then
              echo "  subject:"
              if [ -n "$COUNTRY" ]; then
                echo "    countries: [\"${COUNTRY}\"]"
              fi
              if [ -n "$ORGANIZATION" ]; then
                echo "    organizations: [\"${ORGANIZATION}\"]"
              fi
            fi
            cat <<'YAML'
            privateKey:
              algorithm: RSA
              size: 2048
              rotationPolicy: Always
            issuerRef:
              name: ncm
              kind: CMPIssuer
              group: certmanager.misiektoja.github.io
          YAML
          } | kubectl apply -f -

          kubectl wait certificate/interop -n "$ISSUER_NAMESPACE" --for condition=Ready --timeout 10m

      - name: Check the issued certificate
        if: steps.configured.outputs.run == 'true'
        run: |
          kubectl get secret interop-tls -n "$ISSUER_NAMESPACE" -o jsonpath='{.data.tls\.crt}' | base64 -d > issued.pem
          openssl x509 -in issued.pem -noout -subject -issuer -dates -serial
          kubectl get cmptransactions -n "$ISSUER_NAMESPACE" -o wide

      - name: Re-enroll the certificate
        # Repeat P10CR is not KUR and succeeds only where the server profile allows another enrollment
        # for the same identity, so it is opt-in rather than part of every run.
        if: steps.configured.outputs.run == 'true' && inputs.renewal
        run: |
          # Deleting the Secret is what cert-manager treats as a lost certificate. With
          # rotationPolicy Always it generates a new key and submits a new CertificateRequest, which
          # reaches the server as another P10CR.
          before="$(kubectl get secret interop-tls -n "$ISSUER_NAMESPACE" -o jsonpath='{.data.tls\.crt}')"
          kubectl delete secret interop-tls -n "$ISSUER_NAMESPACE"

          # The Certificate stays Ready until cert-manager notices the missing Secret, so the new
          # certificate itself is what the wait is for.
          after=""
          for _ in $(seq 1 60); do
            after="$(kubectl get secret interop-tls -n "$ISSUER_NAMESPACE" -o jsonpath='{.data.tls\.crt}' 2>/dev/null || true)"
            if [ -n "$after" ] && [ "$after" != "$before" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$after" ] || [ "$after" = "$before" ]; then
            echo "::error::re-enrollment did not produce a new certificate"
            exit 1
          fi
          kubectl wait certificate/interop -n "$ISSUER_NAMESPACE" --for condition=Ready --timeout 5m

      - name: Report what happened
        if: always() && steps.configured.outputs.run == 'true'
        run: |
          kubectl get certificate,certificaterequest,cmpissuer,cmptransaction -n "$ISSUER_NAMESPACE" || true
          kubectl describe certificaterequest -n "$ISSUER_NAMESPACE" || true
          kubectl logs -n cmp-issuer-system deployment/cmp-issuer-controller-manager --tail=200 || true

      - name: Delete the cluster
        if: always() && steps.configured.outputs.run == 'true'
        run: make cleanup-test-e2e
