# Enrolls a real certificate from a hosted Nokia NCM instance and checks the result end to end.
#
# This workflow is the only one that talks to a PKI outside the repository, so it never runs on a push
# or a pull request. Start it by hand, or enable the schedule below once the endpoint is stable.
#
# It is inert until the repository carries the configuration. Every run begins with a preflight job
# that reports which protection mechanisms are configured and stops cleanly when none are, so a fork or
# a repository without the endpoint gets a green skip rather than a failure.
#
# Repository configuration, all under Settings, Secrets and variables, Actions:
#
# | Secret | Required | Contents |
# | --- | --- | --- |
# | `NCM_CMP_URL` | yes | CMP endpoint URL, for example `https://host.example/pkix/` |
# | `NCM_CMP_RECIPIENT` | yes | Recipient distinguished name of the issuing CA |
# | `NCM_CMP_TRUST` | yes | PEM anchor that signs the CMP responses |
# | `NCM_CMP_PBM_REFERENCE` | PasswordBasedMac | PasswordBasedMac reference value |
# | `NCM_CMP_PBM_SECRET` | PasswordBasedMac | PasswordBasedMac secret value |
# | `NCM_CMP_SIGNER_CERT` | Signature | PEM certificate that protects the request |
# | `NCM_CMP_SIGNER_KEY` | Signature | PEM private key for that certificate |
# | `NCM_CMP_SIGNER_CHAIN` | no | PEM chain sent in `extraCerts` when the CA needs it |
# | `NCM_CMP_TLS_TRUST` | no | PEM anchor for the HTTPS server certificate, when it is not publicly trusted |
#
# | Variable | Required | Contents |
# | --- | --- | --- |
# | `NCM_CMP_CERT_PROFILE` | no | Certificate profile name sent as `spec.protocol.certProfile` |
# | `NCM_CMP_COMMON_NAME` | no | Common name to enroll, default `cmp-issuer-interop.example` |
#
# The endpoint URL and the recipient are held as secrets rather than variables so that a run against a
# private instance does not print them in the log.
name: NCM interoperability

on:
  workflow_dispatch:
    inputs:
      kubernetes:
        description: "Kind node image, empty for the default"
        required: false
        type: string
        default: ""
      certManager:
        description: "cert-manager version to install"
        required: false
        type: string
        default: v1.20.3
      renewal:
        description: "Re-enroll the certificate afterwards to exercise repeat P10CR"
        required: false
        type: boolean
        default: false
  # Enable once the endpoint is stable enough to gate a weekly run on.
  # schedule:
  #   - cron: "23 4 * * 2"

permissions: {}

env:
  KIND_CLUSTER: cmp-issuer-interop
  MANAGER_IMAGE: localhost/cmp-issuer:interop
  ISSUER_NAMESPACE: cmp-issuer-interop

jobs:
  preflight:
    name: Check the endpoint configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      passwordbasedmac: ${{ steps.check.outputs.passwordbasedmac }}
      signature: ${{ steps.check.outputs.signature }}
    steps:
      - name: Report which protection mechanisms are configured
        id: check
        env:
          URL: ${{ secrets.NCM_CMP_URL }}
          RECIPIENT: ${{ secrets.NCM_CMP_RECIPIENT }}
          TRUST: ${{ secrets.NCM_CMP_TRUST }}
          PBM_REFERENCE: ${{ secrets.NCM_CMP_PBM_REFERENCE }}
          PBM_SECRET: ${{ secrets.NCM_CMP_PBM_SECRET }}
          SIGNER_CERT: ${{ secrets.NCM_CMP_SIGNER_CERT }}
          SIGNER_KEY: ${{ secrets.NCM_CMP_SIGNER_KEY }}
        run: |
          # Only whether each value is present is reported. No value is printed.
          endpoint=true
          for name in URL RECIPIENT TRUST; do
            if [ -z "${!name}" ]; then
              echo "missing NCM_CMP_${name}"
              endpoint=false
            fi
          done

          passwordbasedmac=false
          if [ "$endpoint" = true ] && [ -n "$PBM_REFERENCE" ] && [ -n "$PBM_SECRET" ]; then
            passwordbasedmac=true
          fi
          signature=false
          if [ "$endpoint" = true ] && [ -n "$SIGNER_CERT" ] && [ -n "$SIGNER_KEY" ]; then
            signature=true
          fi

          echo "passwordbasedmac=${passwordbasedmac}" >> "$GITHUB_OUTPUT"
          echo "signature=${signature}" >> "$GITHUB_OUTPUT"
          {
            echo "| Protection | Configured |"
            echo "| --- | --- |"
            echo "| PasswordBasedMac | ${passwordbasedmac} |"
            echo "| Signature | ${signature} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$passwordbasedmac" = false ] && [ "$signature" = false ]; then
            echo "No NCM endpoint is configured for this repository, so the enrollment jobs are skipped."
          fi

  enroll:
    name: Enroll with ${{ matrix.protection }}
    needs: preflight
    if: needs.preflight.outputs.passwordbasedmac == 'true' || needs.preflight.outputs.signature == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        protection: [PasswordBasedMac, Signature]
    steps:
      - name: Decide whether this protection mechanism is configured
        id: configured
        env:
          PASSWORDBASEDMAC: ${{ needs.preflight.outputs.passwordbasedmac }}
          SIGNATURE: ${{ needs.preflight.outputs.signature }}
          PROTECTION: ${{ matrix.protection }}
        run: |
          case "$PROTECTION" in
            PasswordBasedMac) run="$PASSWORDBASEDMAC" ;;
            Signature) run="$SIGNATURE" ;;
            *) run=false ;;
          esac
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then
            echo "${PROTECTION} is not configured for this repository, skipping."
          fi

      - name: Clone the code
        if: steps.configured.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        if: steps.configured.outputs.run == 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Create the cluster
        if: steps.configured.outputs.run == 'true'
        env:
          KIND_NODE_IMAGE: ${{ inputs.kubernetes }}
        run: make setup-test-e2e

      - name: Install cert-manager
        if: steps.configured.outputs.run == 'true'
        env:
          CERT_MANAGER_VERSION: ${{ inputs.certManager }}
        run: |
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          kubectl wait deployment.apps/cert-manager-webhook --for condition=Available --namespace cert-manager --timeout 5m

      - name: Build and load the manager image
        if: steps.configured.outputs.run == 'true'
        run: |
          make docker-build IMG="$MANAGER_IMAGE"
          ./bin/kind load docker-image "$MANAGER_IMAGE" --name "$KIND_CLUSTER"

      - name: Install cmp-issuer
        if: steps.configured.outputs.run == 'true'
        run: |
          # The namespace has to exist first, because the chart creates the credential reader binding
          # in every namespace listed in credentialNamespaces.
          kubectl create namespace "$ISSUER_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          make helm-deploy IMG="$MANAGER_IMAGE" \
            HELM_EXTRA_ARGS="--set logging.level=debug --set credentialNamespaces={${ISSUER_NAMESPACE}}"
          kubectl get pods -n cmp-issuer-system

      - name: Store the endpoint credentials
        if: steps.configured.outputs.run == 'true'
        env:
          TRUST: ${{ secrets.NCM_CMP_TRUST }}
          TLS_TRUST: ${{ secrets.NCM_CMP_TLS_TRUST }}
          PBM_REFERENCE: ${{ secrets.NCM_CMP_PBM_REFERENCE }}
          PBM_SECRET: ${{ secrets.NCM_CMP_PBM_SECRET }}
          SIGNER_CERT: ${{ secrets.NCM_CMP_SIGNER_CERT }}
          SIGNER_KEY: ${{ secrets.NCM_CMP_SIGNER_KEY }}
          SIGNER_CHAIN: ${{ secrets.NCM_CMP_SIGNER_CHAIN }}
          PROTECTION: ${{ matrix.protection }}
        run: |
          # Values are written from the environment into files under the runner temporary directory and
          # read back with --from-file, so no credential ever appears in a command line.
          umask 077
          material="${RUNNER_TEMP}/cmp"
          mkdir -p "$material"

          printf '%s' "$TRUST" > "${material}/ca.crt"
          kubectl create secret generic cmp-trust -n "$ISSUER_NAMESPACE" \
            --from-file=ca.crt="${material}/ca.crt" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "$TLS_TRUST" ]; then
            printf '%s' "$TLS_TRUST" > "${material}/tls-ca.crt"
            kubectl create secret generic cmp-tls-trust -n "$ISSUER_NAMESPACE" \
              --from-file=ca.crt="${material}/tls-ca.crt" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          if [ "$PROTECTION" = PasswordBasedMac ]; then
            printf '%s' "$PBM_REFERENCE" > "${material}/reference"
            printf '%s' "$PBM_SECRET" > "${material}/secret"
            kubectl create secret generic cmp-credentials -n "$ISSUER_NAMESPACE" \
              --from-file=reference="${material}/reference" \
              --from-file=secret="${material}/secret" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            printf '%s' "$SIGNER_CERT" > "${material}/tls.crt"
            printf '%s' "$SIGNER_KEY" > "${material}/tls.key"
            create=(kubectl create secret generic cmp-credentials -n "$ISSUER_NAMESPACE"
              --from-file=tls.crt="${material}/tls.crt"
              --from-file=tls.key="${material}/tls.key")
            if [ -n "$SIGNER_CHAIN" ]; then
              # A separate file name so the chain cannot overwrite the CMP trust anchor.
              printf '%s' "$SIGNER_CHAIN" > "${material}/signer-chain.crt"
              create+=(--from-file=ca.crt="${material}/signer-chain.crt")
            fi
            "${create[@]}" --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Create the issuer
        if: steps.configured.outputs.run == 'true'
        env:
          URL: ${{ secrets.NCM_CMP_URL }}
          RECIPIENT: ${{ secrets.NCM_CMP_RECIPIENT }}
          CERT_PROFILE: ${{ vars.NCM_CMP_CERT_PROFILE }}
          TLS_TRUST: ${{ secrets.NCM_CMP_TLS_TRUST }}
          SIGNER_CHAIN: ${{ secrets.NCM_CMP_SIGNER_CHAIN }}
          PROTECTION: ${{ matrix.protection }}
        run: |
          # The manifest is fed through stdin so the endpoint and the recipient stay out of the log.
          {
            cat <<YAML
          apiVersion: certmanager.misiektoja.github.io/v1alpha1
          kind: CMPIssuer
          metadata:
            name: ncm
            namespace: ${ISSUER_NAMESPACE}
          spec:
            endpoint:
              url: ${URL}
              timeout: 30s
              maxResponseSize: 1048576
            protocol:
              version: 2
              initialEnrollment: P10CR
              recipient: "${RECIPIENT}"
              confirmation: Explicit
          YAML
            if [ -n "$CERT_PROFILE" ]; then
              echo "    certProfile: \"${CERT_PROFILE}\""
            fi
            if [ "$PROTECTION" = PasswordBasedMac ]; then
              cat <<'YAML'
            protection:
              type: PasswordBasedMac
              passwordBasedMac:
                secretRef:
                  name: cmp-credentials
                referenceKey: reference
                secretKey: secret
                algorithm:
                  owf: SHA256
                  mac: HMACSHA256
                  iterationCount: 1024
          YAML
            else
              cat <<'YAML'
            protection:
              type: Signature
              signature:
                secretRef:
                  name: cmp-credentials
                certificateKey: tls.crt
                privateKeyKey: tls.key
          YAML
              # The chain is only sent when a key names it, so it is set with the secret that carries it.
              if [ -n "$SIGNER_CHAIN" ]; then
                echo "      chainKey: ca.crt"
              fi
            fi
            cat <<'YAML'
            cmpTrust:
              caSecretRef:
                name: cmp-trust
                key: ca.crt
            policy:
              grantedModifications: Reject
          YAML
            if [ -n "$TLS_TRUST" ]; then
              cat <<'YAML'
            transport:
              tls:
                caSecretRef:
                  name: cmp-tls-trust
                  key: ca.crt
          YAML
            fi
          } | kubectl apply -f -

          kubectl wait cmpissuer/ncm -n "$ISSUER_NAMESPACE" --for condition=Ready --timeout 2m

      - name: Enroll a certificate
        if: steps.configured.outputs.run == 'true'
        env:
          COMMON_NAME: ${{ vars.NCM_CMP_COMMON_NAME }}
        run: |
          cat <<YAML | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: interop
            namespace: ${ISSUER_NAMESPACE}
          spec:
            secretName: interop-tls
            commonName: ${COMMON_NAME:-cmp-issuer-interop.example}
            privateKey:
              algorithm: RSA
              size: 2048
              rotationPolicy: Always
            issuerRef:
              name: ncm
              kind: CMPIssuer
              group: certmanager.misiektoja.github.io
          YAML

          kubectl wait certificate/interop -n "$ISSUER_NAMESPACE" --for condition=Ready --timeout 10m

      - name: Check the issued certificate
        if: steps.configured.outputs.run == 'true'
        run: |
          kubectl get secret interop-tls -n "$ISSUER_NAMESPACE" -o jsonpath='{.data.tls\.crt}' | base64 -d > issued.pem
          openssl x509 -in issued.pem -noout -subject -issuer -dates -serial
          kubectl get cmptransactions -n "$ISSUER_NAMESPACE" -o wide

      - name: Re-enroll the certificate
        # Repeat P10CR is not KUR and succeeds only where the server profile allows another enrollment
        # for the same identity, so it is opt-in rather than part of every run.
        if: steps.configured.outputs.run == 'true' && inputs.renewal
        run: |
          # Deleting the Secret is what cert-manager treats as a lost certificate. With
          # rotationPolicy Always it generates a new key and submits a new CertificateRequest, which
          # reaches the server as another P10CR.
          before="$(kubectl get secret interop-tls -n "$ISSUER_NAMESPACE" -o jsonpath='{.data.tls\.crt}')"
          kubectl delete secret interop-tls -n "$ISSUER_NAMESPACE"

          # The Certificate stays Ready until cert-manager notices the missing Secret, so the new
          # certificate itself is what the wait is for.
          after=""
          for _ in $(seq 1 60); do
            after="$(kubectl get secret interop-tls -n "$ISSUER_NAMESPACE" -o jsonpath='{.data.tls\.crt}' 2>/dev/null || true)"
            if [ -n "$after" ] && [ "$after" != "$before" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$after" ] || [ "$after" = "$before" ]; then
            echo "::error::re-enrollment did not produce a new certificate"
            exit 1
          fi
          kubectl wait certificate/interop -n "$ISSUER_NAMESPACE" --for condition=Ready --timeout 5m

      - name: Report what happened
        if: always() && steps.configured.outputs.run == 'true'
        run: |
          kubectl get certificate,certificaterequest,cmpissuer,cmptransaction -n "$ISSUER_NAMESPACE" || true
          kubectl describe certificaterequest -n "$ISSUER_NAMESPACE" || true
          kubectl logs -n cmp-issuer-system deployment/cmp-issuer-controller-manager --tail=200 || true

      - name: Delete the cluster
        if: always() && steps.configured.outputs.run == 'true'
        run: make cleanup-test-e2e
