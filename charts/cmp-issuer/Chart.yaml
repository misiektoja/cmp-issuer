apiVersion: v2
name: cmp-issuer
description: Cert-manager issuer for Certificate Management Protocol (CMP) servers
type: application

## version is the chart version and has to be bare SemVer, so it is the release tag without the leading
## v. appVersion is the image tag, which does carry the v, and the two are kept in step by the release
## workflow packaging the chart with --version and --app-version derived from the same tag. Installing
## from a clone resolves the manager image from appVersion, so a mismatch here points that install at a
## tag the registry does not have.
version: 0.2.0
appVersion: "v0.2.0"

## Verified on Kubernetes v1.34, v1.35 and v1.36. The floor is set lower because nothing in the chart
## needs a newer API, so an older cluster is allowed to install at its own risk. The `-0` suffix keeps
## prerelease and distribution versions such as `v1.34.1-gke.100` inside the range.
kubeVersion: ">= 1.31.0-0"

home: https://misiektoja.github.io/cmp-issuer/
icon: https://raw.githubusercontent.com/misiektoja/cmp-issuer/main/docs/assets/logo.svg

sources:
  - https://github.com/misiektoja/cmp-issuer

maintainers:
  - name: misiektoja
    url: https://github.com/misiektoja

keywords:
  - kubernetes
  - operator
  - cert-manager
  - cmp
  - cmpv2
  - rfc4210
  - pki
  - certificates
  - x509
  - issuer

## Artifact Hub reads these when it indexes the chart, and they are frozen once the version is
## published, so a correction needs a new chart version. Images and maintainers are deliberately not
## repeated here, since Artifact Hub takes those from the rendered templates and from the maintainers
## field above. artifacthub.io/changes describes this release alone and is rewritten for the next one.
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://misiektoja.github.io/cmp-issuer/
    - name: Source
      url: https://github.com/misiektoja/cmp-issuer
    - name: Release notes
      url: https://github.com/misiektoja/cmp-issuer/blob/main/RELEASE_NOTES.md
    - name: Security policy
      url: https://github.com/misiektoja/cmp-issuer/blob/main/SECURITY.md
    - name: Issues
      url: https://github.com/misiektoja/cmp-issuer/issues
    - name: support
      url: https://github.com/misiektoja/cmp-issuer/blob/main/SUPPORT.md
  artifacthub.io/crds: |
    - kind: CMPIssuer
      version: v1alpha1
      name: cmpissuers.certmanager.misiektoja.github.io
      displayName: CMP Issuer
      description: Namespaced issuer that enrolls cert-manager certificates from one CMP server
    - kind: CMPClusterIssuer
      version: v1alpha1
      name: cmpclusterissuers.certmanager.misiektoja.github.io
      displayName: CMP Cluster Issuer
      description: Cluster-wide issuer that reads its credentials from the controller namespace
    - kind: CMPTransaction
      version: v1alpha1
      name: cmptransactions.certmanager.misiektoja.github.io
      displayName: CMP Transaction
      description: Durable record of one CMP exchange, so a controller restart resumes it instead of enrolling twice
  artifacthub.io/changes: |
    - kind: added
      description: True CMP Key Update Request renewal with current-certificate authentication, CRMF proof of possession and oldCertID
    - kind: added
      description: Separate renewal endpoints for CMP servers that use different aliases for enrollment and key update
    - kind: added
      description: Interoperable and RFC 9483 response validation profiles with focused compatibility controls
    - kind: changed
      description: KUR workload keys are read only after cert-manager ownership, revision and Secret state validation
    - kind: changed
      description: Release downloads include complete source archives, checksums and build provenance attestations
