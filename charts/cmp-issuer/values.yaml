## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false for a CRD-only install. All manager supporting resources, including RBAC, the
  ## ServiceAccount, metrics and approval grants are omitted.
  ##
  enabled: true

  replicas: 1

  image:
    ## Published manager image. Set this to your own registry when mirroring the image, or to a
    ## `repository@sha256:...` reference to pin a digest instead of a tag.
    ##
    repository: ghcr.io/misiektoja/cmp-issuer
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Namespace the controller reads CMPClusterIssuer credential and trust Secrets from. Defaults to
  ## the release namespace, which is where the chart binds the credential reader, so leave it unset
  ## unless those Secrets live somewhere else. A namespace outside the release namespace also gets a
  ## credential reader RoleBinding, and requires rbac.namespaced to be false.
  ##
  # clusterResourceNamespace: ""

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Extra environment variables for the manager container. The chart already sets CMP_ISSUER_IMAGE,
  ## CMP_ISSUER_CHART and CMP_ISSUER_RELEASE, which the manager reports in its startup log line, and
  ## setting one of those names here overrides what the chart reports.
  ##
  # extraEnv:
  #   - name: HTTPS_PROXY
  #     value: http://proxy.example.com:3128

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding, watch only the release namespace and disable CMPClusterIssuer
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for the CRDs. They grant access to CMPIssuer and
    ## CMPClusterIssuer resources and bind to nobody until you create a binding, so they are inert
    ## until used. CMPClusterIssuer roles are omitted in namespaced mode. On by default so that a chart
    ## install and the installer manifest grant the same set of roles. Set to false to leave the
    ## delegation roles out entirely.
    ##
    enabled: true

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller logging.
##
## Read the log with:
##   kubectl logs -n cmp-issuer-system deploy/cmp-issuer-controller-manager -c manager -f
##
logging:
  # Verbosity. One of 'debug', 'info' or 'error', or an integer where a higher number is more
  # verbose. 'info' logs one line per enrollment outcome, carrying the issued subject, serial,
  # validity, SANs, key type, issuing CA and duration. 'debug' adds every reconcile decision and the
  # body type and size of each CMP message that is sent or received.
  level: info
  # Level at and above which a stack trace is attached. One of 'info', 'error' or 'panic'.
  stacktraceLevel: panic
  # Log format. 'json' suits log collectors, 'console' is easier to read by eye.
  encoder: json

## Namespaces whose CMPIssuer credentials or KUR workload Secrets the controller may read.
##
## The controller has no cluster-wide Secret access. Each namespace hosting a CMPIssuer needs a
## RoleBinding granting it the credential reader role there, and listing the namespace here creates
## that binding for you instead of applying it by hand.
##
## Only name namespaces you intend the controller to read Secrets in. Every entry widens the boundary
## the project is built around, so this is a convenience for namespaces you already decided on rather
## than a default. Each namespace must exist before the release is installed or upgraded.
##
## A CMPClusterIssuer using P10CR does not need this. It reads credentials only from the release
## namespace. A CMPClusterIssuer using KUR needs each workload namespace listed here so the controller
## can read the authenticated current and staged key Secrets.
##
## Requires rbac.namespaced to be false, because a RoleBinding in another namespace cannot reference
## a Role that lives in this one.
##
## credentialNamespaces:
##   - team-a
##   - team-b
##
credentialNamespaces: []

## Permission for the cert-manager approver to act on this issuer type.
##
## cert-manager's built-in approver only approves CertificateRequest resources for signer types it
## holds this permission for, and it reports nothing when it lacks it. Without this, every request
## referencing a CMPIssuer stays pending with no error and no CMP message is sent.
##
## Set create to false when approver-policy makes the approval decision instead.
##
certManagerApproval:
  # Create the ClusterRole and ClusterRoleBinding that let cert-manager approve these requests
  create: true
  # ServiceAccount the cert-manager controller runs as
  serviceAccountName: cert-manager
  # Namespace cert-manager is installed in
  namespace: cert-manager

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Serve metrics over HTTPS with authentication and authorization (true), or over plain HTTP with
  # neither (false). When true the controller checks every scrape with a TokenReview and a
  # SubjectAccessReview, so the chart also creates the metrics-auth ClusterRole and its binding, and
  # a scraper needs the metrics-reader ClusterRole to read /metrics. tls below decides where the
  # serving certificate comes from.
  # When false the endpoint is readable by anything that can reach the port, so pair it with
  # networkPolicy.enabled.
  secure: true
  # TLS for the metrics endpoint. Only consulted when secure is true.
  tls:
    certManager:
      # Issue the metrics serving certificate with cert-manager, so a scraper verifies the endpoint
      # instead of trusting whatever answers on the port. Left false, the controller generates a
      # certificate nothing signs and a scraper has to skip verification, which means the
      # ServiceMonitor hands its bearer token to an endpoint it has not identified.
      # Needs cert-manager in the cluster, which this issuer requires anyway.
      enabled: false
      # Existing Issuer or ClusterIssuer to sign it, for example
      # {kind: ClusterIssuer, name: internal-ca}. Left empty, the chart creates a self-signed Issuer
      # in the release namespace, which is enough for a scraper that trusts the CA in the Secret.
      issuerRef: {}

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false
