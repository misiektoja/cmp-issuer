{{- if include "cmp-issuer.managerEnabled" . }}
{{- $clusterResourceNamespace := include "cmp-issuer.clusterResourceNamespace" . }}
{{- $namespaces := .Values.credentialNamespaces | default list }}
{{- if ne $clusterResourceNamespace .Release.Namespace }}
{{- $namespaces = concat $namespaces (list $clusterResourceNamespace) }}
{{- end }}
{{- if .Values.rbac.namespaced }}
{{- if .Values.credentialNamespaces }}
{{- fail "credentialNamespaces requires a cluster-scoped credential reader. Set rbac.namespaced to false, or create the RoleBindings yourself." }}
{{- end }}
{{- if ne $clusterResourceNamespace .Release.Namespace }}
{{- fail "manager.clusterResourceNamespace outside the release namespace requires a cluster-scoped credential reader. Set rbac.namespaced to false, or create the RoleBinding yourself." }}
{{- end }}
{{- end }}
{{- range $namespace := $namespaces | uniq }}
{{- if ne $namespace $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "credential-reader-rolebinding" "context" $) }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "credential-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "cmp-issuer.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
