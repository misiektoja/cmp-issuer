{{- if and (include "cmp-issuer.managerEnabled" .) .Values.certManagerApproval.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "cert-manager-approver-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "cert-manager-approver" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.certManagerApproval.serviceAccountName }}
  namespace: {{ .Values.certManagerApproval.namespace }}
{{- end }}
