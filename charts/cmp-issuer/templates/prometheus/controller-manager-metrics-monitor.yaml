{{- if .Values.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cmp-issuer.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "controller-manager-metrics-monitor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - {{- if .Values.metrics.secure }}
    # The endpoint authorizes this token with a SubjectAccessReview, so the scraping ServiceAccount
    # needs the metrics-reader ClusterRole.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    {{- end }}
    path: /metrics
    port: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    {{- if .Values.metrics.secure }}
    tlsConfig:
      serverName: {{ include "cmp-issuer.metricsServiceName" . }}.{{ .Release.Namespace }}.svc
      {{- if include "cmp-issuer.metricsCertEnabled" . }}
      # Prometheus resolves this Secret in the ServiceMonitor's own namespace, which is where the
      # Certificate writes it. Only the authority is read, because the endpoint authenticates the
      # scrape by token and never asks for a client certificate.
      insecureSkipVerify: false
      ca:
        secret:
          name: {{ include "cmp-issuer.metricsCertSecretName" . }}
          key: ca.crt
      {{- else }}
      # The controller generates its own serving certificate and nothing signs it, so there is no
      # authority to verify against. Set metrics.tls.certManager.enabled to verify the endpoint.
      insecureSkipVerify: true
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cmp-issuer.name" . }}
      control-plane: controller-manager
{{- end }}
