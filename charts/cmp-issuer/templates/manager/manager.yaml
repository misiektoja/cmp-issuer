{{- if include "cmp-issuer.managerEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cmp-issuer.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cmp-issuer.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "cmp-issuer.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        # Rendered unconditionally so the served scheme follows metrics.secure rather than the
        # binary default, which is what the metrics Service port name and the ServiceMonitor
        # scheme are both derived from.
        - --metrics-secure={{ .Values.metrics.secure }}
        {{- if include "cmp-issuer.metricsCertEnabled" . }}
        # Without this the metrics server generates a certificate nothing signs, which a scraper can
        # only accept by skipping verification.
        - --metrics-cert-path={{ include "cmp-issuer.metricsCertPath" . }}
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:8081
        # A CMPClusterIssuer is cluster scoped, so its credential and trust Secrets come from one
        # namespace. The binary defaults that to cmp-issuer-system, which is wrong for a release
        # installed anywhere else, because the credential reader is bound in the release namespace.
        # manager.args is rendered after this, so a flag repeated there still wins.
        - --cluster-resource-namespace={{ include "cmp-issuer.clusterResourceNamespace" . }}
        {{- if .Values.rbac.namespaced }}
        - --watch-namespace={{ .Release.Namespace }}
        {{- end }}
        {{- with .Values.logging.level }}
        - --zap-log-level={{ . }}
        {{- end }}
        {{- with .Values.logging.stacktraceLevel }}
        - --zap-stacktrace-level={{ . }}
        {{- end }}
        {{- with .Values.logging.encoder }}
        - --zap-encoder={{ . }}
        {{- end }}
        {{- range .Values.manager.args }}
        - {{ . }}
        {{- end }}
        command:
        - /manager
        env:
        # Reported in the manager's startup log line and by its --version flag, so a support log says
        # which image and which chart release produced the running controller. The build identity is
        # stamped into the binary, and these are what only the install knows.
        - name: CMP_ISSUER_IMAGE
          value: "{{ include "cmp-issuer.image" . }}"
        - name: CMP_ISSUER_CHART
          value: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        - name: CMP_ISSUER_RELEASE
          value: "{{ .Release.Name }}"
        {{- with .Values.manager.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        image: "{{ include "cmp-issuer.image" . }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- if include "cmp-issuer.metricsCertEnabled" . }}
          - mountPath: {{ include "cmp-issuer.metricsCertPath" . }}
            name: metrics-certs
            readOnly: true
          {{- end }}
          {{- with .Values.manager.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if and (not (include "cmp-issuer.metricsCertEnabled" .)) (not .Values.manager.extraVolumeMounts) }}
          []
          {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "cmp-issuer.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        {{- if include "cmp-issuer.metricsCertEnabled" . }}
        - name: metrics-certs
          secret:
            secretName: {{ include "cmp-issuer.metricsCertSecretName" . }}
            optional: false
            items:
            - key: ca.crt
              path: ca.crt
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
        {{- end }}
        {{- with .Values.manager.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and (not (include "cmp-issuer.metricsCertEnabled" .)) (not .Values.manager.extraVolumes) }}
        []
        {{- end }}
{{- end }}
