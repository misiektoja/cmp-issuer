{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cmptransactions.certmanager.misiektoja.github.io
spec:
  group: certmanager.misiektoja.github.io
  names:
    kind: CMPTransaction
    listKind: CMPTransactionList
    plural: cmptransactions
    singular: cmptransaction
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.issuerRef.name
      name: Issuer
      type: string
    - jsonPath: .status.polls
      name: Polls
      type: integer
    - jsonPath: .spec.deadline
      name: Deadline
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CMPTransaction records the state of one CMP transaction so that an asynchronous enrollment
          survives a controller restart and an issued certificate is never enrolled twice. The controller
          creates it before the first message is sent, removes it when the transaction fails and retains it
          with the issued chain afterwards, until it is garbage collected with the CertificateRequest that
          owns it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CMPTransaction
            properties:
              certificateRequestName:
                description: CertificateRequestName is the CertificateRequest this
                  transaction enrolls.
                maxLength: 253
                type: string
              certificateRequestUID:
                description: CertificateRequestUID distinguishes a recreated CertificateRequest
                  that reuses a name.
                maxLength: 253
                type: string
              configurationDigest:
                description: |-
                  ConfigurationDigest binds an unfinished transaction to the credential Secret versions used
                  when its first request was protected.
                maxLength: 64
                type: string
              csrDigest:
                description: |-
                  CSRDigest is the lowercase hexadecimal SHA-256 digest of the DER CSR this transaction enrolls.
                  It identifies the enrolled request in diagnostics and guards a recorded chain from being
                  returned for a different CSR.
                maxLength: 64
                type: string
              deadline:
                description: Deadline is the instant after which the transaction is
                  abandoned as failed.
                format: date-time
                type: string
              issuerRef:
                description: IssuerRef identifies the issuer that served this transaction.
                properties:
                  generation:
                    description: Generation binds the transaction to the issuer spec
                      generation that started it.
                    format: int64
                    type: integer
                  kind:
                    description: Kind is the issuer resource kind.
                    enum:
                    - CMPIssuer
                    - CMPClusterIssuer
                    type: string
                  name:
                    description: Name is the issuer resource name.
                    maxLength: 253
                    type: string
                  uid:
                    description: UID distinguishes a recreated issuer that reuses
                      a name.
                    maxLength: 253
                    type: string
                required:
                - kind
                - name
                type: object
              operation:
                description: Operation is the CMP operation this transaction performs.
                enum:
                - P10CR
                type: string
              protocolVersion:
                description: ProtocolVersion is the CMP protocol version of every
                  message in this transaction.
                format: int32
                maximum: 3
                minimum: 2
                type: integer
              transactionID:
                description: TransactionID is the CMP transactionID that every message
                  of this transaction carries.
                format: byte
                maxLength: 64
                type: string
            required:
            - certificateRequestName
            - certificateRequestUID
            - deadline
            - transactionID
            type: object
          status:
            description: status defines the observed state of CMPTransaction
            properties:
              certReqID:
                description: CertReqID is the certificate request identifier that
                  the server polls against.
                format: int64
                type: integer
              completionTime:
                description: CompletionTime records when the transaction reached the
                  Issued phase.
                format: date-time
                type: string
              issuedChain:
                description: |-
                  IssuedChain is the validated leaf-first certificate chain in DER form, recorded before the
                  chain is returned so that a restart in that window does not enroll a second certificate.
                items:
                  format: byte
                  type: string
                maxItems: 16
                type: array
              lastTransitionTime:
                description: LastTransitionTime records when the phase last changed.
                format: date-time
                type: string
              phase:
                description: |-
                  Phase reports whether the enrollment request is in flight, the server asked the client to poll,
                  the certificate awaits confirmation, or the validated chain is recorded and confirmed.
                enum:
                - Enrolling
                - Polling
                - Confirming
                - Issued
                type: string
              polls:
                description: |-
                  Polls counts the pollReq messages already sent, which the maximumPolls limit bounds. The
                  enrollment request that first received a waiting response is not counted.
                format: int32
                type: integer
              recipNonce:
                description: RecipNonce is the sender nonce of the last accepted response,
                  echoed by the next request.
                format: byte
                maxLength: 64
                type: string
              requestNonce:
                description: |-
                  RequestNonce is the sender nonce of the request whose response the server delayed. RFC 9483
                  section 4.4 requires the client to keep it for the whole transaction because a conformant
                  server echoes it in the recipient nonce of the final response instead of the nonce of the
                  last poll request.
                format: byte
                maxLength: 64
                type: string
              responseSigner:
                description: |-
                  ResponseSigner is the DER encoded certificate that protected the last response. It is retained
                  because servers such as NCM omit extraCerts and senderKID from later messages of a transaction.
                format: byte
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
