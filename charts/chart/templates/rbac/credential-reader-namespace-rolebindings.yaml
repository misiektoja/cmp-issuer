{{- if .Values.credentialNamespaces }}
{{- if .Values.rbac.namespaced }}
{{- fail "credentialNamespaces requires a cluster-scoped credential reader. Set rbac.namespaced to false, or create the RoleBindings yourself." }}
{{- end }}
{{- range $namespace := .Values.credentialNamespaces }}
{{- if ne $namespace $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "credential-reader-rolebinding" "context" $) }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cmp-issuer.resourceName" (dict "suffix" "credential-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "cmp-issuer.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
