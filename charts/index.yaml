apiVersion: v1
entries:
  cmp-issuer:
  - annotations:
      artifacthub.io/category: security
      artifacthub.io/changes: |
        - kind: fixed
          description: An interrupted confirmation resends certConf instead of polling for an answer to a certConf that was never sent
        - kind: fixed
          description: KUR renewals retry temporary Kubernetes API failures while reading the owning Certificate
        - kind: fixed
          description: The failure metric label carries one bit name from a fixed vocabulary instead of a combined bit list
        - kind: changed
          description: Unfinished KUR transactions survive metadata-only writes to their workload Secrets
        - kind: changed
          description: KUR reads the current key only from a Secret that cert-manager wrote for the owning Certificate
        - kind: changed
          description: spec.protocol.certProfile is documented as reserved until its encoding is implemented
      artifacthub.io/crds: |
        - kind: CMPIssuer
          version: v1alpha1
          name: cmpissuers.certmanager.misiektoja.github.io
          displayName: CMP Issuer
          description: Namespaced issuer that enrolls cert-manager certificates from one CMP server
        - kind: CMPClusterIssuer
          version: v1alpha1
          name: cmpclusterissuers.certmanager.misiektoja.github.io
          displayName: CMP Cluster Issuer
          description: Cluster-wide issuer that reads its credentials from the controller namespace
        - kind: CMPTransaction
          version: v1alpha1
          name: cmptransactions.certmanager.misiektoja.github.io
          displayName: CMP Transaction
          description: Durable record of one CMP exchange, so a controller restart resumes it instead of enrolling twice
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://misiektoja.github.io/cmp-issuer/
        - name: Source
          url: https://github.com/misiektoja/cmp-issuer
        - name: Release notes
          url: https://github.com/misiektoja/cmp-issuer/blob/main/RELEASE_NOTES.md
        - name: Security policy
          url: https://github.com/misiektoja/cmp-issuer/blob/main/SECURITY.md
        - name: Issues
          url: https://github.com/misiektoja/cmp-issuer/issues
        - name: support
          url: https://github.com/misiektoja/cmp-issuer/blob/main/SUPPORT.md
