site_name: cmp-issuer
site_description: A vendor-neutral cert-manager external issuer for Certificate Management Protocol servers
site_url: https://misiektoja.github.io/cmp-issuer/
repo_url: https://github.com/misiektoja/cmp-issuer
repo_name: misiektoja/cmp-issuer
copyright: Copyright the cmp-issuer Authors, licensed under Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The documentation build runs with --strict so every one of these findings fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Support matrix: support-matrix.md
  - Architecture: architecture.md
  - User guide:
      - Enrollment: guide/enrollment.md
      - Message protection: guide/message-protection.md
      - CMP response trust: guide/cmp-response-trust.md
      - HTTP and HTTPS transport: guide/transport.md
      - Transaction recovery: guide/transaction-recovery.md
      - P10CR renewal and KUR roadmap: guide/renewal-and-kur.md
      - cert-manager private-key handling: guide/private-key-handling.md
  - Reference:
      - CMPIssuer: reference/cmpissuer.md
      - CMPClusterIssuer: reference/cmpclusterissuer.md
  - Interoperability:
      - Tested PKIs: interoperability/tested-pkis.md
  - Operations:
      - Credential Secret access: operations/secret-access.md
      - Metrics: operations/metrics.md
      - Troubleshooting: operations/troubleshooting.md
  - Security:
      - Security model: security/security-model.md
      - Threat model: security/threat-model.md
      - Provenance and supply chain: provenance.md
  - Development:
      - Development: development/development.md
      - Testing: development/testing.md
      - Release process: development/release-process.md
  - Known limitations: known-limitations.md
  - Design decisions:
      - CMP library selection: adr/0001-cmp-library.md
      - Issuer reconciliation library: adr/0002-issuer-lib.md
