# This rule is not used by the project cmp-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the certmanager.misiektoja.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cmp-issuer
    app.kubernetes.io/managed-by: kustomize
  name: cmpissuer-editor-role
rules:
- apiGroups:
  - certmanager.misiektoja.github.io
  resources:
  - cmpissuers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certmanager.misiektoja.github.io
  resources:
  - cmpissuers/status
  verbs:
  - get
