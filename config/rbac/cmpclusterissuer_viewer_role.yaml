# This rule is not used by the project cmp-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to certmanager.misiektoja.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cmp-issuer
    app.kubernetes.io/managed-by: kustomize
  name: cmpclusterissuer-viewer-role
rules:
- apiGroups:
  - certmanager.misiektoja.github.io
  resources:
  - cmpclusterissuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certmanager.misiektoja.github.io
  resources:
  - cmpclusterissuers/status
  verbs:
  - get
