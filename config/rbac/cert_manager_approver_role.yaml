# Lets the cert-manager controller approve CertificateRequest resources that reference a CMPIssuer or
# CMPClusterIssuer. Its built-in approver acts only on signer types it holds this permission for, and
# it reports nothing when it lacks it, so without this every request stays pending with no error.
#
# Remove this and its binding when approval is delegated to approver-policy instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cmp-issuer
    app.kubernetes.io/managed-by: kustomize
  name: cert-manager-approver-role
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - signers
  verbs:
  - approve
  resourceNames:
  - cmpissuers.certmanager.misiektoja.github.io/*
  - cmpclusterissuers.certmanager.misiektoja.github.io/*
