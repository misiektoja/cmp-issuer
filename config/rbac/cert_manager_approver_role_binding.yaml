# Binds the approver role to the cert-manager controller ServiceAccount. Adjust the subject when
# cert-manager runs under a different name or namespace than the upstream default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: cmp-issuer
    app.kubernetes.io/managed-by: kustomize
  name: cert-manager-approver-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-approver
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
