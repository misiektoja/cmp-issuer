title = "cmp-issuer"

[extend]
useDefault = true

[[allowlists]]
description = "Paths that never enter the repository or that hold build output only"
paths = [
  # Interoperability lab notes and credentials that are excluded from version control. The gitleaks
  # target guards this entry by failing when any file under local/ is tracked.
  '''^local/''',
  # Downloaded tool binaries and generated distribution artifacts.
  '''^bin/''',
  '''^dist/''',
  # The documentation site mkdocs renders from docs/, which this scan covers in full.
  '''^site/''',
]

# Go identifiers such as enableRFC9483 sit next to words like "key" in function signatures, so the
# default generic-api-key rule captures them as credential values. Allowlisting the identifier shape
# keeps that rule active for real high-entropy secrets.
[[allowlists]]
description = "Go identifiers that the generic credential rule mistakes for secrets"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''\.go$''']
regexTarget = "secret"
regexes = [
  # camelCase and PascalCase identifiers built from words and short acronyms, such as enableRFC9483.
  '''^[A-Za-z][a-z0-9]*(?:(?:[A-Z][a-z][A-Za-z0-9]*)|(?:[A-Z]{1,6}[0-9]{0,6}))*$''',
  # snake_case and SCREAMING_SNAKE_CASE identifiers, such as expect_key_change.
  '''^[A-Za-z_][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+$''',
]
